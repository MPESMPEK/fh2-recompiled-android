name: Build Windows PC (fh2.exe)

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/build_android.yml'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/build_android.yml'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build fh2.exe (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@v1
        with:
          version: 1.11.1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19.1.7"

      - name: Verify Compiler Toolchain
        shell: pwsh
        run: |
          clang --version
          clang++ --version
          ninja --version
          cmake --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S app -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DREXSDK_DIR="${{ github.workspace }}/sdk" `
            -DREXGLUE_BUILD_TOOLS=OFF `
            -DREXGLUE_USE_D3D12=ON `
            -DREXGLUE_USE_VULKAN=ON

      - name: Build Game Executable and Plugins
        shell: pwsh
        run: |
          cmake --build build --config Release --target fh2

      - name: Prepare Distribution Package
        shell: pwsh
        run: |
          pwsh tools/package_windows.ps1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fh2-windows-x64
          path: dist/fh2-windows-x64.zip
          retention-days: 14

      - name: Publish Direct Release to GitHub
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $TAG = "v0.4.3-windows"
          try { gh release delete $TAG --yes } catch {}
          try { git tag -d $TAG } catch {}
          gh release create $TAG "dist/fh2-windows-x64.zip" `
            --title "FH2 Recompiled Windows PC v0.4.3 (x64)" `
            --notes "Native Windows x64 build (fh2.exe) with Direct3D 12 and Vulkan backend support. Includes launcher batch scripts and keyboard racing layout."
