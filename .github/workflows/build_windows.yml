name: Build Windows PC (fh2.exe)

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/build_android.yml'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/build_android.yml'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build fh2.exe (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@v1
        with:
          version: 1.11.1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19.1.7"

      - name: Verify Compiler Toolchain
        shell: pwsh
        run: |
          clang --version
          clang++ --version
          ninja --version
          cmake --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S app -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DREXSDK_DIR="${{ github.workspace }}/sdk" `
            -DREXGLUE_BUILD_TOOLS=OFF `
            -DREXGLUE_USE_D3D12=ON `
            -DREXGLUE_USE_VULKAN=ON

      - name: Build Game Executable and Plugins
        shell: pwsh
        run: |
          cmake --build build --config Release --target fh2

      - name: Prepare Distribution Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter "fh2.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            throw "fh2.exe not found in build directory!"
          }
          $outDir = $exe.DirectoryName
          Write-Host "Output directory located at: $outDir"
          Get-ChildItem -Path $outDir

          New-Item -ItemType Directory -Path dist/fh2-windows-x64 -Force
          Copy-Item "$outDir\fh2.exe" dist/fh2-windows-x64/
          Copy-Item "$outDir\*.dll" dist/fh2-windows-x64/
          if (Test-Path "$outDir\*.pdb") {
            Copy-Item "$outDir\*.pdb" dist/fh2-windows-x64/
          }

          @'
@echo off
title FH2 Recompiled - DirectX 12
echo =========================================================
echo   FH2 Recompiled (Windows PC x64) - D3D12
echo =========================================================
echo.
echo Pastikan Anda memiliki game dump Forza Horizon 2 (Xbox 360).
echo Masukkan flag --game_data_root="C:\path\ke\folder_game" jika belum ada.
echo.
fh2.exe --gpu_plugin=xenos --gpu=d3d12 --gpu_allow_invalid_fetch_constants=true --mnk_mode=true --mnk_preset=race %*
pause
'@ | Out-File -FilePath dist/fh2-windows-x64/run_d3d12.bat -Encoding ASCII

          @'
@echo off
title FH2 Recompiled - Vulkan
echo =========================================================
echo   FH2 Recompiled (Windows PC x64) - Vulkan
echo =========================================================
echo.
echo Pastikan Anda memiliki game dump Forza Horizon 2 (Xbox 360).
echo Masukkan flag --game_data_root="C:\path\ke\folder_game" jika belum ada.
echo.
fh2.exe --gpu_plugin=xenos --gpu=vulkan --gpu_allow_invalid_fetch_constants=true --mnk_mode=true --mnk_preset=race %*
pause
'@ | Out-File -FilePath dist/fh2-windows-x64/run_vulkan.bat -Encoding ASCII

          @'
FH2 Recompiled for Windows PC (x64)
====================================
Kebutuhan Sistem:
- OS: Windows 10 / 11 64-bit
- GPU: DirectX 12 / Vulkan kompatibel

Cara Menjalankan:
1. Double-click run_d3d12.bat (DirectX 12) atau run_vulkan.bat (Vulkan).
2. Anda juga dapat memasukkan path folder game atau ISO langsung:
   fh2.exe --game_data_root="D:\Games\ForzaHorizon2" --gpu=d3d12 --mnk_mode=true --mnk_preset=race

Kontrol Keyboard (Mode Balap / Race Layout):
- W : Gas (Throttle)
- S : Rem (Brake)
- A / D : Belok Kiri / Kanan (Steer)
- Spasi : Rem Tangan (Handbrake / Tombol A)
- Panah / Mouse : Kamera
- I, J, K, L : D-Pad
- Enter : Start
- Esc / Tab : Back
- F4 : Menu Pengaturan / Remap Controller langsung di game
'@ | Out-File -FilePath dist/fh2-windows-x64/README.txt -Encoding UTF8

          Compress-Archive -Path dist/fh2-windows-x64/* -DestinationPath dist/fh2-windows-x64.zip -Force
          Write-Host "Distribution archive created:"
          Get-Item dist/fh2-windows-x64.zip | Select-Object Name, Length, LastWriteTime

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fh2-windows-x64
          path: dist/fh2-windows-x64.zip
          retention-days: 14

      - name: Publish Direct Release to GitHub
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $TAG = "v0.4.3-windows"
          gh release delete "$TAG" --yes 2>$null || true
          git tag -d "$TAG" 2>$null || true
          gh release create "$TAG" "dist/fh2-windows-x64.zip" `
            --title "FH2 Recompiled Windows PC v0.4.3 (x64)" `
            --notes "Native Windows x64 build (fh2.exe) with Direct3D 12 and Vulkan backend support. Includes launcher batch scripts and keyboard racing layout."
