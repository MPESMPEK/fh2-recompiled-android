name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" "cmake;3.30.5" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: |
          chmod +x android/gradlew
          chmod +x build_android.sh

      - name: Build Release APK with Gradle
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cd android
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseG1GC"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FH2-Recompiled-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
